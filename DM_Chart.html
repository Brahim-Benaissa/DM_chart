  <style>
    :root{
      --bg:#05070d; --ink:#eaeaea; --mut:#9aa3b2;
      --cy:#00b4d8; --rd:#ff4b4b; --pu:#b266ff; --am:#ffc107; --te:#26c6da;
    }
    *{box-sizing:border-box}
    html, body { height:100%; }
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:'Inter',sans-serif; overflow:hidden;
    }

    /* ---------- one unified scene ---------- */
    .scene{
      position:fixed; inset:0;
      background:radial-gradient(circle at 50% 42%, #0b0e18 0%, #05070d 100%);
    }
    #sky{
      position:absolute; inset:0; width:100%; height:100%;
      display:block; cursor:crosshair;
    }

    /* top-center control pill: [slider] [fullscreen] */
    .topctl{
      position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:8;
      width:min(60vw, 430px);
      display:flex; align-items:center; gap:10px;
      background:rgba(7,10,18,.66); border:1px solid rgba(255,255,255,.09);
      border-radius:12px; padding:10px 12px 12px 16px;
      backdrop-filter:blur(4px);
    }
    .topctl .track{ flex:1 1 auto; min-width:0; }

    /* hover tooltip label — left of the bar on wide screens, below otherwise */
    .topctl label{
      position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%);
      white-space:nowrap; cursor:pointer;
      font-weight:600; font-size:.64rem; color:#a7e6f7;
      background:rgba(7,10,18,.94); border:1px solid rgba(255,255,255,.14);
      border-radius:8px; padding:6px 11px; line-height:1;
      opacity:0; pointer-events:none;
      transition:opacity .18s ease;
    }
    .topctl:hover label,
    .topctl.show-label label{ opacity:1; }
    @media (min-width:1150px){
      .topctl label{
        top:50%; left:auto; right:calc(100% + 10px);
        transform:translateY(-50%);
      }
    }

    /* thin slider */
    input[type="range"]{
      -webkit-appearance:none; appearance:none;
      width:100%; height:16px; background:transparent;
      margin:0; cursor:pointer; outline:none;
    }
    input[type="range"]::-webkit-slider-runnable-track{
      height:4px; border-radius:2px;
      background:linear-gradient(90deg, rgba(255,75,75,.85) 0%, #1976d2 100%);
    }
    input[type="range"]::-webkit-slider-thumb{
      -webkit-appearance:none; appearance:none;
      width:16px; height:16px; border-radius:50%; margin-top:-6px;
      background:radial-gradient(circle at 35% 35%, #eafcff 0%, #00b4d8 55%, #01485c 100%);
      border:1px solid rgba(255,255,255,.28);
      box-shadow:0 0 10px rgba(0,180,216,.55), 0 1px 3px rgba(0,0,0,.6);
      transition:transform .15s ease, box-shadow .15s ease;

    input[type="range"]:hover::-webkit-slider-thumb{
      transform:scale(1.18);
      box-shadow:0 0 16px rgba(0,180,216,.9), 0 1px 3px rgba(0,0,0,.6);

    input[type="range"]::-moz-range-track{
      height:4px; border-radius:2px;

    }
    input[type="range"]::-moz-range-thumb{
      width:16px; height:16px; border-radius:50%;
      background:radial-gradient(circle at 35% 35%, #eafcff 0%, #00b4d8 55%, #01485c 100%);
      border:1px solid rgba(255,255,255,.28);

    /* fullscreen button — right end of the bar */
    #fsButton{

    /* compact color key, top-left */
    .legend{
      position:absolute; top:12px; left:10px; z-index:5;
      display:flex; flex-direction:column; gap:3px;
      font-size:.64rem; color:#c7d0dc;

      display:inline-block; width:8px; height:8px; border-radius:50%;

    /* chart panels */
    .panel{
      position:absolute; top:calc(64% - 3px); bottom:10px; z-index:4;
      display:flex; flex-direction:column;
      background:rgba(9,12,20,.85);

    .panel-title{
      flex:none; font-weight:600; color:#cfd8e3; margin-bottom:3px;
      font-size:clamp(.58rem, 1.1vw, .74rem);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .chartbox{ flex:1 1 auto; min-height:0; position:relative; }

    /* hover legend box — floats ABOVE the panel, outside the curve area */
    .chart-legend{
      position:absolute; bottom:calc(100% + 8px); z-index:6;
      display:flex; flex-wrap:wrap; align-items:center;
      gap:6px 14px;
      background:rgba(7,10,18,.94); border:1px solid rgba(255,255,255,.14);
      border-radius:8px; padding:7px 11px;
      font-size:.62rem; color:#c7d0dc; line-height:1;
      max-width:min(360px, 60vw);
      opacity:0; pointer-events:none;
      transition:opacity .18s ease;
    }
    .panel-left  .chart-legend{ left:0; }
    .panel-right .chart-legend{ right:0; }
    .panel:hover .chart-legend,
    .panel.show-legend .chart-legend{ opacity:1; }
    .chart-legend .li{ display:flex; align-items:center; gap:5px; white-space:nowrap; }
    .chart-legend .sw{ width:11px; height:0; border-top:2.5px solid; border-radius:2px; }
    .chart-legend .sw.dash{ border-top-style:dashed; }
    .chart-legend .dot{ width:7px; height:7px; border-radius:50%; }

    /* toast */
    #toast{
      visibility:hidden; min-width:200px; margin-left:-100px;
      background-color:#333; color:#fff; text-align:center; border-radius:6px;
      padding:10px; position:fixed; z-index:999; left:50%; bottom:30px;
      font-size:14px; opacity:0;
      transition:opacity .5s ease, transform .5s ease;
    }
    sup{ font-size:.65em; }

    @media (max-width:720px){ .legend{ display:none; } }
    @media (max-width:640px){
      .panel{ padding:4px 5px 6px; border-radius:10px; }
      .panel-left { left:6px;  width:calc(32% - 6px); }
      .panel-right{ right:6px; width:calc(32% - 6px); }
      .topctl{ padding:8px 9px 10px 12px; gap:8px; }
      .topctl label{ font-size:.56rem; padding:5px 9px; }
      .chart-legend{ font-size:.56rem; gap:4px 9px; padding:5px 8px; }
    }

    <section class="panel panel-right">

        <canvas id="massChart"></canvas>

      <div class="chart-legend">
        <span class="li"><span class="sw" style="border-color:#ffc107"></span>Bulge</span>
        <span class="li"><span class="sw" style="border-color:#26c6da"></span>Disk + gas</span>
        <span class="li"><span class="sw dash" style="border-color:#b266ff"></span>Dark matter halo</span>
        <span class="li"><span class="sw" style="border-color:#f2f4fb; border-top-width:3px"></span>Total</span>

  <div id="toast"></div>

  <script>
  /* ================= PHYSICS (unchanged calculations) ================= */
  const G = 4.3009e-6;                       // kpc (km/s)^2 / Msun
  const R_OBS = [0.875,1.75,2.625,3.5,4.375,5.25,6.125,6.965,7.84]; // kpc
  const V_OBS = [24.8,46.2,60.5,69.6,77.5,82.9,84.1,85.6,87.6];     // km/s
  const V_ERR = V_OBS.map(v => v*0.05);

  const BULGE = { M: 1.3e9, a: 0.9 };
  const DISK  = { M: 2.6e9, a: 2.6 };
  const Fexp  = x => 1 - Math.exp(-x)*(1 + x + x*x/2);
  const v2c   = (R,c) => G*c.M*Fexp(R/c.a)/R;
  const v2bar = R => v2c(R,BULGE) + v2c(R,DISK);
  const Mbar  = R => BULGE.M*Fexp(R/BULGE.a) + DISK.M*Fexp(R/DISK.a);
  const pisoF = (R,rc) => { const u = R/rc; return 1 - Math.atan(u)/u; };

  // Least-squares halo fit (baryons fixed)
  function fitHalo(){
    let best = null;
    for(let rc = 0.5; rc <= 12.0001; rc += 0.1){
      let sf = 0, sff = 0;
      for(let i=0;i<R_OBS.length;i++){
        const d = V_OBS[i]*V_OBS[i] - v2bar(R_OBS[i]);
        const f = pisoF(R_OBS[i], rc);
        sf += f*d; sff += f*f;
      }
      const vinf2 = sf/sff;
      let chi = 0;
      for(let i=0;i<R_OBS.length;i++){
        const r = (V_OBS[i]*V_OBS[i] - v2bar(R_OBS[i])) - vinf2*pisoF(R_OBS[i], rc);
        chi += r*r;
      }
      if(!best || chi < best.chi) best = { rc, vinf2, chi };
    }
    return best;
  }
  const FIT = fitHalo();
  const vTotal = (R,t) => Math.sqrt(v2bar(R) + t*t*FIT.vinf2*pisoF(R,FIT.rc));
  const Mdm    = (R,t) => (t*t*FIT.vinf2/G)*FIT.rc*((R/FIT.rc) - Math.atan(R/FIT.rc));

  let tVal = 0, crossCache = null;
  function crossover(){
    if(tVal < 0.05) return null;
    for(let r=0.4; r<=9; r+=0.05){
      if(tVal*tVal*FIT.vinf2*pisoF(r,FIT.rc) >= v2bar(r)) return r;
    }
    return null;
  }
  let rms = 0;
  for(let i=0;i<R_OBS.length;i++){
    const d = vTotal(R_OBS[i],1) - V_OBS[i]; rms += d*d;
  }
  rms = Math.sqrt(rms/R_OBS.length);

  const GRID = [];
  for(let r=0.35; r<=9.2; r+=0.11) GRID.push(+r.toFixed(3));
  const fmtSci = x => { const e=Math.floor(Math.log10(x)), m=x/Math.pow(10,e);
    return (m<1.05?'':m.toFixed(1)+'×')+'10<sup>'+e+'</sup>'; };

  /* ================= SKY CANVAS ================= */
  const sky = document.getElementById('sky');
  const sctx = sky.getContext('2d');
  let W=0, H=0, KPC=10, CX=0, CY=0, SS=1;
  function fitSky(){
    const r = sky.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    sky.width = Math.round(r.width*dpr); sky.height = Math.round(r.height*dpr);
    sctx.setTransform(dpr,0,0,dpr,0,0);
    W = r.width; H = r.height;
    KPC = Math.min(W,H)/34.7;
    SS = Math.max(0.68, Math.min(1.1, KPC/31));
    CX = W/2;
    CY = Math.max(H*0.45, 7.84*KPC + 74);
  }

  // seeded RNG for reproducibility
  let seed = 20260907;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed>>>15, 1 | seed);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296; };
  const expR = (a, rmax) => { let r; do { r = -a*Math.log(1-rnd()); } while(r>rmax); return r; };

  const stars = [];
  for(let i=0;i<430;i++){
    const bul = rnd() < 0.3;
    const rKpc = bul ? expR(0.9, 4.5) : expR(2.6, 7.84);
    stars.push({ r:rKpc, th:rnd()*Math.PI*2, b:0.35+rnd()*0.65 });
  }
  const gasPts = [];
  for(let i=0;i<230;i++) gasPts.push({ r:expR(3.8, 9.2), th:rnd()*Math.PI*2, b:0.12+rnd()*0.22 });
  const haloPts = [];
  for(let i=0;i<520;i++) haloPts.push({ r:14.5*Math.pow(rnd(),0.72), th:rnd()*Math.PI*2, b:0.1+rnd()*0.3 });
  const backdrop = [];
  for(let i=0;i<140;i++) backdrop.push({ x:rnd(), y:rnd(), b:0.05+rnd()*0.14 });

  // soft star sprite
  const sprite = document.createElement('canvas'); sprite.width = sprite.height = 32;
  { const x = sprite.getContext('2d');
    const g = x.createRadialGradient(16,16,0,16,16,16);
    g.addColorStop(0,'rgba(255,250,235,1)'); g.addColorStop(0.3,'rgba(255,230,180,0.65)');
    g.addColorStop(1,'rgba(255,220,150,0)');
    x.fillStyle = g; x.fillRect(0,0,32,32); }

  function rrect(x,y,w,h,r){
    sctx.beginPath();
    sctx.moveTo(x+r,y);
    sctx.arcTo(x+w,y,x+w,y+h,r); sctx.arcTo(x+w,y+h,x,y+h,r);
    sctx.arcTo(x,y+h,x,y,r); sctx.arcTo(x,y,x+w,y,r);
    sctx.closePath();
  }

  /* ---------- hover state ---------- */
  let mouse = null, mouseExp = 0;
  function setMouse(e){
    const rect = sky.getBoundingClientRect();
    mouse = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    mouseExp = 0;
  }
  sky.addEventListener('pointermove', setMouse);
  sky.addEventListener('pointerdown', setMouse);
  sky.addEventListener('pointerleave', () => { mouse = null; });
  sky.addEventListener('pointerup', e => {
    if(e.pointerType === 'touch') mouseExp = performance.now() + 1600;
  });

  function hoverLines(r){
    const vt = vTotal(r, tVal);
    const vb = Math.sqrt(v2bar(r));
    const vh = Math.sqrt(Math.max(0, tVal*tVal*FIT.vinf2*pisoF(r,FIT.rc)));
    const L = [];
    L.push({ t:`R = ${r.toFixed(1)} kpc`, c:'#e8ecf4' });
    L.push({ t:`v = ${vt.toFixed(0)} km/s`, c:'#ffffff' });
    L.push({ t:`baryons ${vb.toFixed(0)} · halo ${vh.toFixed(0)} km/s`, c:'#9fb3c8' });
    let near = -1, nd = 0.3;
    for(let i=0;i<R_OBS.length;i++){
      const d = Math.abs(r - R_OBS[i]);
      if(d < nd){ nd = d; near = i; }
    }
    if(near >= 0) L.push({ t:`observed: ${V_OBS[near].toFixed(1)} ± ${V_ERR[near].toFixed(1)} km/s`, c:'#ff8a8a' });
    if(r > 9.6){
      L.push({ t:'inside the dark matter halo (invisible — illustration)', c:'#d4baff' });
      if(r > 14.3) L.push({ t:'halo continues well beyond this frame', c:'#8fa0b4' });
    } else if(tVal > 0.05 && crossCache){
      if(r > crossCache) L.push({ t:'dark matter dominates here', c:'#d4baff' });
      else L.push({ t:'baryons dominate here', c:'#ffd54f' });
    }
    return L;
  }

  function drawHover(){
    if(!mouse) return;
    const dx = mouse.x - CX, dy = mouse.y - CY;
    const r = Math.hypot(dx,dy)/KPC;
    if(r > 16 || r < 0.05) return;

    sctx.save();
    sctx.setLineDash([4,4]);
    sctx.strokeStyle = 'rgba(255,255,255,0.3)'; sctx.lineWidth = 1;
    sctx.beginPath(); sctx.moveTo(CX,CY); sctx.lineTo(mouse.x,mouse.y); sctx.stroke();
    sctx.strokeStyle = 'rgba(255,255,255,0.16)';
    sctx.beginPath(); sctx.arc(CX,CY,r*KPC,0,6.284); sctx.stroke();
    sctx.setLineDash([]);
    sctx.strokeStyle = 'rgba(255,255,255,0.5)';
    sctx.beginPath();
    sctx.moveTo(CX-5,CY); sctx.lineTo(CX+5,CY);
    sctx.moveTo(CX,CY-5); sctx.lineTo(CX,CY+5);
    sctx.stroke();
    sctx.fillStyle = '#fff';
    sctx.beginPath(); sctx.arc(mouse.x,mouse.y,2.4,0,6.284); sctx.fill();

    const lines = hoverLines(r);
    sctx.font = '11px Inter, sans-serif';
    let tw = 0;
    for(const l of lines) tw = Math.max(tw, sctx.measureText(l.t).width);
    const pad = 8, lh = 15;
    const bw = tw + pad*2, bh = lines.length*lh + pad*2 - 5;
    let bx = mouse.x + 16, by = mouse.y - bh - 12;
    if(bx + bw > W - 6) bx = mouse.x - bw - 16;
    if(by < 6) by = mouse.y + 18;
    if(bx < 6) bx = 6;
    sctx.fillStyle = 'rgba(7,10,18,0.92)';
    rrect(bx,by,bw,bh,6); sctx.fill();
    sctx.strokeStyle = 'rgba(0,180,216,0.35)'; sctx.lineWidth = 1; sctx.stroke();
    lines.forEach((l,i) => {
      sctx.fillStyle = l.c;
      sctx.fillText(l.t, bx + pad, by + pad + 4 + i*lh);
    });
    sctx.restore();
  }

  let lastT = performance.now();
  function drawSky(dt){
    sctx.clearRect(0,0,W,H);

    // backdrop
    for(const b of backdrop){
      sctx.globalAlpha = b.b; sctx.fillStyle = '#cfe3ff';
      sctx.fillRect(b.x*W, b.y*H, 1, 1);
    }
    sctx.globalAlpha = 1;

    // dark matter halo — violet
    if(tVal > 0.01){
      const R = 15.2*KPC;
      const g = sctx.createRadialGradient(CX,CY,0,CX,CY,R);
      g.addColorStop(0,   `rgba(178,102,255,${0.34*tVal})`);
      g.addColorStop(0.5, `rgba(124,58,217,${0.20*tVal})`);
      g.addColorStop(1,   'rgba(94,53,177,0)');
      sctx.fillStyle = g; sctx.fillRect(0,0,W,H);
      for(const p of haloPts){
        sctx.globalAlpha = tVal*p.b*0.85;
        sctx.fillStyle = '#c9a2ff';
        sctx.beginPath();
        sctx.arc(CX + p.r*KPC*Math.cos(p.th), CY + p.r*KPC*Math.sin(p.th), 1.4*SS, 0, 6.284);
        sctx.fill();
      }
      sctx.globalAlpha = 1;
      sctx.setLineDash([5,5]);
      sctx.strokeStyle = `rgba(197,151,255,${0.85*tVal})`; sctx.lineWidth = 1.4;
      sctx.beginPath(); sctx.arc(CX,CY,14*KPC,0,6.284); sctx.stroke();
      sctx.setLineDash([]);
    }

    // gas — cyan/teal
    {
      const g = sctx.createRadialGradient(CX,CY,0,CX,CY,9.2*KPC);
      g.addColorStop(0,'rgba(38,198,218,0.12)'); g.addColorStop(1,'rgba(38,198,218,0)');
      sctx.fillStyle = g; sctx.beginPath(); sctx.arc(CX,CY,9.2*KPC,0,6.284); sctx.fill();
      sctx.fillStyle = '#4dd0e1';
      for(const p of gasPts){
        sctx.globalAlpha = p.b;
        sctx.beginPath();
        sctx.arc(CX+p.r*KPC*Math.cos(p.th), CY+p.r*KPC*Math.sin(p.th), Math.max(0.8,1.1*SS), 0, 6.284);
        sctx.fill();
      }
      sctx.globalAlpha = 1;
    }

    // stars with speed trails — all on the same clock
    for(const s of stars){
      const v = vTotal(s.r, tVal);
      const om = v/s.r * 0.025;
      s.th += om*dt;
      const px = CX + s.r*KPC*Math.cos(s.th), py = CY + s.r*KPC*Math.sin(s.th);
      const trailT = 0.03;
      for(let j=6; j>=1; j--){
        const a2 = s.th - om*trailT*j/6;
        sctx.globalAlpha = s.b*0.4*(1 - j/7);
        sctx.drawImage(sprite, CX + s.r*KPC*Math.cos(a2)-3*SS, CY + s.r*KPC*Math.sin(a2)-3*SS, 6*SS, 6*SS);
      }
      sctx.globalAlpha = s.b;
      sctx.drawImage(sprite, px-3.4*SS, py-3.4*SS, 6.8*SS, 6.8*SS);
    }
    sctx.globalAlpha = 1;

    drawHover();
  }
  function frame(now){
    const dt = Math.min(0.05,(now-lastT)/1000); lastT = now;
    if(mouse && mouseExp && now > mouseExp) mouse = null;
    drawSky(dt);
    requestAnimationFrame(frame);
  }

  /* ================= CHARTS ================= */
  const errBars = { id:'errBars', afterDatasetsDraw(chart){
    const di = chart.data.datasets.findIndex(d => d.errorBars); if(di < 0) return;
    const meta = chart.getDatasetMeta(di), ys = chart.scales.y, ctx = chart.ctx;
    ctx.save(); ctx.strokeStyle = 'rgba(255,75,75,0.85)'; ctx.lineWidth = 1.2;
    meta.data.forEach((el,i) => {
      const p = chart.data.datasets[di].data[i], e = chart.data.datasets[di].err[i];
      const y1 = ys.getPixelForValue(p.y+e), y2 = ys.getPixelForValue(p.y-e);
      ctx.beginPath();
      ctx.moveTo(el.x,y1); ctx.lineTo(el.x,y2);
      ctx.moveTo(el.x-3,y1); ctx.lineTo(el.x+3,y1);
      ctx.moveTo(el.x-3,y2); ctx.lineTo(el.x+3,y2);
      ctx.stroke();
    }); ctx.restore(); } };

  const obsPts = R_OBS.map((r,i) => ({ x:r, y:V_OBS[i] }));
  const curveChart = new Chart(document.getElementById('curveChart'), {
    type:'line',
    data:{ datasets:[
      { label:'Bulge', data:GRID.map(r=>({x:r,y:Math.sqrt(v2c(r,BULGE))})),
        borderColor:'#ffc107', borderWidth:1.6, pointRadius:0, tension:.25 },
      { label:'Disk + gas', data:GRID.map(r=>({x:r,y:Math.sqrt(v2c(r,DISK))})),
        borderColor:'#26c6da', borderWidth:1.6, pointRadius:0, tension:.25 },
      { label:'Dark matter halo (fitted)', data:GRID.map(r=>({x:r,y:Math.sqrt(FIT.vinf2*pisoF(r,FIT.rc))})),
        borderColor:'#b266ff', borderWidth:2, borderDash:[6,4], pointRadius:0, tension:.25 },
      { label:'Total (baryons + halo × t)', data:GRID.map(r=>({x:r,y:vTotal(r,0)})),
        borderColor:'#f2f4fb', borderWidth:2.6, pointRadius:0, tension:.25 },
      { type:'scatter', label:'Observed (SPARC UGC 06399)', data:obsPts, err:V_ERR, errorBars:true,
        borderColor:'#ff4b4b', backgroundColor:'#ff4b4b', pointRadius:3.5, pointHoverRadius:5 }
    ]},
    options:{ maintainAspectRatio:false, animation:{duration:400},
      plugins:{ legend:{ display:false },
        tooltip:{ callbacks:{ title:(it)=>it[0].raw.x.toFixed(2)+' kpc',
          label:(it)=>it.dataset.label+': '+it.parsed.y.toFixed(1)+' km/s' } } },
      scales:{ x:{ type:'linear', min:0, max:9.5, title:{display:true,text:'Radius (kpc)',color:'#cfd8e3',font:{size:10}},
          grid:{color:'rgba(255,255,255,.07)'}, ticks:{color:'#9aa3b2',font:{size:9}} },
        y:{ min:0, max:100, title:{display:true,text:'Velocity (km/s)',color:'#cfd8e3',font:{size:10}},
          grid:{color:'rgba(255,255,255,.07)'}, ticks:{color:'#9aa3b2',font:{size:9}} } } },
    plugins:[errBars]
  });

  const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  const sup = n => String(n).split('').map(c=>SUP[+c]).join('');
  const massChart = new Chart(document.getElementById('massChart'), {
    type:'line',
    data:{ datasets:[
      { label:'Bulge', data:GRID.filter(r=>r>=0.5&&r<=8).map(r=>({x:r,y:BULGE.M*Fexp(r/BULGE.a)})),
        borderColor:'#ffc107', borderWidth:1.6, pointRadius:0 },
      { label:'Disk + gas', data:GRID.filter(r=>r>=0.5&&r<=8).map(r=>({x:r,y:DISK.M*Fexp(r/DISK.a)})),
        borderColor:'#26c6da', borderWidth:1.6, pointRadius:0 },
      { label:'Dark matter halo', data:GRID.filter(r=>r>=0.5&&r<=8).map(r=>({x:r,y:Mdm(r,0)})),
        borderColor:'#b266ff', borderWidth:2, borderDash:[6,4], pointRadius:0 },
      { label:'Total', data:GRID.filter(r=>r>=0.5&&r<=8).map(r=>({x:r,y:Mbar(r)+Mdm(r,0)})),
        borderColor:'#f2f4fb', borderWidth:2.4, pointRadius:0 },
      { label:'M ∝ R (flat rotation curve)', data:[{x:0.6,y:1.13e9},{x:8,y:1.5e10}],
        borderColor:'rgba(255,255,255,.35)', borderWidth:1.4, borderDash:[2,5], pointRadius:0 }
    ]},
    options:{ maintainAspectRatio:false, animation:{duration:400},
      plugins:{ legend:{ display:false },
        tooltip:{ callbacks:{ title:(it)=>it[0].raw.x.toFixed(2)+' kpc',
          label:(it)=>it.dataset.label+': '+fmtSci(it.parsed.y)+' M☉' } } },
      scales:{ x:{ type:'logarithmic', min:0.5, max:8, title:{display:true,text:'Radius (kpc)',color:'#cfd8e3',font:{size:10}},
          grid:{color:'rgba(255,255,255,.07)'}, ticks:{color:'#9aa3b2',font:{size:9}} },
        y:{ type:'logarithmic', min:1e8, max:3e10, title:{display:true,text:'Enclosed mass (M☉)',color:'#cfd8e3',font:{size:10}},
          grid:{color:'rgba(255,255,255,.07)'},
          ticks:{ color:'#9aa3b2', font:{size:9}, callback:v=>{
            const l=Math.log10(v);
            return Math.abs(l-Math.round(l))<1e-9 ? '10'+sup(Math.round(l)) : '';
          } } } } }
  });

  /* ---------- responsive chart chrome ---------- */
  function styleCharts(){
    const w = Math.min(document.getElementById('curveBox').clientWidth,
                       document.getElementById('massBox').clientWidth);
    const tiny = w < 230, small = w < 380;
    for(const c of [curveChart, massChart]){
      const o = c.options;
      o.scales.x.title.display = !tiny;
      o.scales.y.title.display = !tiny;
      o.scales.x.ticks.font.size = tiny ? 8 : (small ? 8.5 : 9);
      o.scales.y.ticks.font.size = tiny ? 8 : (small ? 8.5 : 9);
      c.update('none');
    }
  }

  /* ---------- touch: tap a panel to reveal its legend ---------- */
  document.querySelectorAll('.panel').forEach(p => {
    p.addEventListener('pointerdown', e => {
      if(e.pointerType !== 'touch') return;
      p.classList.toggle('show-legend');
      clearTimeout(p._t);
      p._t = setTimeout(() => p.classList.remove('show-legend'), 2600);
    });
  });

  /* ================= INTERACTION ================= */
  const slider = document.getElementById('dmSlider');
  const topctl = document.getElementById('topctl');

  function update(){
    tVal = parseFloat(slider.value);
    crossCache = crossover();

    curveChart.data.datasets[2].data = GRID.map(r=>({x:r, y:Math.sqrt(tVal*tVal*FIT.vinf2*pisoF(r,FIT.rc))}));
    curveChart.data.datasets[3].data = GRID.map(r=>({x:r, y:vTotal(r,tVal)}));
    curveChart.update('none');
    massChart.data.datasets[2].data = GRID.filter(r=>r>=0.5&&r<=8).map(r=>({x:r,y:Mdm(r,tVal)}));
    massChart.data.datasets[3].data = GRID.filter(r=>r>=0.5&&r<=8).map(r=>({x:r,y:Mbar(r)+Mdm(r,tVal)}));
    massChart.update('none');
  }
  slider.addEventListener('input', update);

  // touch: reveal the slider label while dragging, fade after release
  slider.addEventListener('pointerdown', e => {
    if(e.pointerType !== 'touch') return;
    topctl.classList.add('show-label');
    clearTimeout(topctl._t);
  });
  slider.addEventListener('pointerup', e => {
    if(e.pointerType !== 'touch') return;
    clearTimeout(topctl._t);
    topctl._t = setTimeout(() => topctl.classList.remove('show-label'), 2000);
  });
  slider.addEventListener('pointercancel', () => {
    clearTimeout(topctl._t);
    topctl._t = setTimeout(() => topctl.classList.remove('show-label'), 2000);
  });

  /* ---------- fullscreen ---------- */
  const fsBtn = document.getElementById('fsButton');
  const fsSupported = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  if(!fsSupported) fsBtn.hidden = true;

  function fsElement(){ return document.fullscreenElement || document.webkitFullscreenElement; }
  function setFsIcon(){
    const on = !!fsElement();
    fsBtn.classList.toggle('is-fs', on);
    fsBtn.setAttribute('aria-label', on ? 'Exit fullscreen' : 'Enter fullscreen');
    fsBtn.title = on ? 'Exit fullscreen' : 'Fullscreen';
  }
  async function toggleFs(){
    const el = document.documentElement;
    try{
      if(fsElement()){
        if(document.exitFullscreen) await document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      } else {
        if(el.requestFullscreen) await el.requestFullscreen();
        else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      }
    }catch(e){ /* user/browser cancelled */ }
  }
  fsBtn.addEventListener('click', toggleFs);
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev =>
    document.addEventListener(ev, () => {
      setFsIcon();
      requestAnimationFrame(() => { fitSky(); styleCharts(); });
    })
  );

  window.addEventListener('resize', () => { fitSky(); styleCharts(); });

  // share + toast
  document.getElementById('shareButton').addEventListener('click', function(){
    navigator.clipboard.writeText(window.location.href)
      .then(() => showToast('Link copied to clipboard!'))
      .catch(() => showToast('Failed to copy the link.'));
  });
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.visibility='visible'; t.style.opacity='1'; t.style.transform='translateY(0)';
    setTimeout(() => { t.style.opacity='0'; t.style.transform='translateY(20px)';
      setTimeout(() => t.style.visibility='hidden', 500); }, 3000);
  }

  fitSky(); update(); styleCharts(); requestAnimationFrame(frame);

  // one-time reveal on load (remove this block if unwanted)
  topctl.classList.add('show-label');
  setTimeout(() => { if(!topctl.matches(':hover')) topctl.classList.remove('show-label'); }, 2800);
  </script>
</body>
</html>
